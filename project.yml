name: Lined
options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
packages:
  LinedKit:
    path: Packages/LinedKit
targets:
  Lined:
    type: application
    platform: iOS
    sources:
      - App
    configFiles:
      Debug: Config/Lined.xcconfig
      Release: Config/Lined.xcconfig
    dependencies:
      - package: LinedKit
        product: LinedModel
      - package: LinedKit
        product: LinedStorage
      - package: LinedKit
        product: LinedRendering
      - package: LinedKit
        product: LinedLayout
      - package: LinedKit
        product: LinedInk
  LinedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    configFiles:
      Debug: Config/LinedTests.xcconfig
      Release: Config/LinedTests.xcconfig
    dependencies:
      - target: Lined
      - package: LinedKit
        product: LinedModel
      - package: LinedKit
        product: LinedLayout
      - package: LinedKit
        product: LinedInk
schemes:
  Lined:
    build:
      targets:
        Lined: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LinedTests
